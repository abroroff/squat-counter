name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The counting logic is camera-independent, so tests only need numpy + pytest.
      - run: pip install numpy==1.26.4 pytest
      - run: pytest -v
